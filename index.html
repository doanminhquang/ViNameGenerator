<html lang="vi">
<meta charset="UTF-8" />
<meta content="width=device-width,initial-scale=1" name="viewport" />
<meta content="ie=edge" http-equiv="X-UA-Compatible" />
<title>Tạo Tên Viêt Nam Ngẫu Nhiên</title>
<link href="css/normalize.css" rel="stylesheet" />
<link href="css/skeleton.css" rel="stylesheet" />
<link href="css/custom.css" rel="stylesheet" />
<div class="bar">
  <aside>
    <div>
      <button class="btntab active" onclick='openTab(event,"name")'>
        Tạo tên</button><button class="btntab" onclick='openTab(event,"user")'>
        Tạo tên tài khoản</button><button class="btntab" id="btntabicons" onclick='openTab(event,"icons")'>
        Tạo ngẫu nhiên icons
      </button>
      <button class="btntab" id="btntabrv" onclick='openTab(event,"rv")'>
        Tạo ngẫu nhiên rv
      </button>
    </div>
    <label class="switch">
      <input type="checkbox" id="show_more" checked />
      <span class="slider round"></span>
    </label>
</div>
</aside>
</div>
<div class="tabcontent" id="name" style="display: block">
  <div class="container">
    <div class="content" id="content">
      <h1>Tạo Tên Ngẫu Nhiên</h1>
      <div id="generate-names">
        <div class="row">
          <div class="columns six">
            <label>
              Dữ liệu chọn lọc:
              <input type="checkbox" id="chkNameFilter" checked="checked" onchange="onchangeNameFilter()" /><br />
              <label id="lblNameChoice">
                Chọn giới tính:<label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Tất cả
                  <input type="radio" name="radNameGender" value="all" checked="checked" /></label>
                <label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Nam <input type="radio" name="radNameGender" value="Nam" /></label>
                <label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Nữ <input type="radio" name="radNameGender" value="Nữ" /></label>
              </label>
            </label>
            <label>Số lượng
              <input id="inputNameQuantity" class="u-full-width" value="100" type="number" /></label><button
              class="u-full-width button-primary" onclick="loadNames()" style="font-family: math">
              Tạo
            </button>
            <section class="tooltip">
              <button class="u-full-width" onclick="CopyName()" style="display: none" id="btncopyname">
                <span class="tooltiptext" id="nameTooltip"></span>Sao chép
              </button>
            </section>
            <a href="" id="txt" style="display: none"><button class="u-full-width">Tải Tệp .txt</button></a><a href=""
              id="csv" style="display: none"><button class="u-full-width">Tải Tệp .csv</button></a>
            <section id="textcopy"></section>
          </div>
          <div class="columns six">
            <div id="result"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tabcontent" id="user">
  <div class="container">
    <div class="content" id="content">
      <h1>Tạo Tên Tài Khoản Ngẫu Nhiên</h1>
      <div id="generate-users">
        <div class="row">
          <div class="columns six">
            <label id="ttlabel">
              Tiền Tố<label style="display: inline; width: fit-content; margin-left: 10px">| Tạo Ngẫu Nhiên
                <input type="checkbox" id="chkPrefixRandom" checked="checked"
                  onchange="onchangePrefixRandom()" /></label><br />
              <input type="text" id="txtPrefixInput" class="u-full-width" disabled="disabled" style="display: none" />
            </label>
            <label>Số lượng
              <input id="inputUserQuantity" class="u-full-width" value="100" type="number" /></label>
            <label id="lblUserLength">Độ dài
              <input id="inputUserLength" class="u-full-width" value="5" type="number" /></label>
            <label id="lblFormatChoice" for="selectFormatChoice" style="display: none">
              Lựa Chọn Định Dạng
              <select name="selectFormatChoice" id="selectFormatChoice" class="u-full-width">
                <option value="dd/mm">dd/mm</option>
                <option value="dd/mm/yy">dd/mm/yy</option>
                <option value="dd/mm/yyyy">dd/mm/yyyy</option>
              </select>
            </label>
            <label style="display: none" id="lblUserSuffix">Đuôi
              <input id="txtUserSuffix" type="text" class="u-full-width" value="@gmail.com" /></label><label>Tùy chọn mở
              rộng</label>
            <div id="divUserOptions" style="display: flex; flex-wrap: wrap; justify-content: center">
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Cả Chữ Hoa <input type="radio" value="up" name="radUserChoice" /></label>
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Không Chữ Hoa
                <input type="radio" value="low" name="radUserChoice" checked="checked" /></label>
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Chỉ Có Số <input type="radio" value="number" name="radUserChoice" /></label>
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Sinh Nhật <input type="radio" value="birthday" name="radUserChoice" /></label>
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Chỉ Dựa Vào Tên
                <input type="radio" value="fullname" name="radUserChoice" /></label>

              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Thêm Đuôi <input id="chkAddSuffix" type="checkbox" /></label>
              <label style="
                    display: inline;
                    width: fit-content;
                    margin-right: 10px;
                  ">Thêm Tiền Tố
                <input id="chkAddPrefix" type="checkbox" checked="checked" /></label>
            </div>
            <label id="moredata">
              Dữ liệu tiền tố chọn lọc:
              <input type="checkbox" id="chkUserPrefixFilter" checked="checked"
                onchange="onchangeUserPrefixFilter()" /><br />
              <label id="lblUserChoice">
                Chọn giới tính:<label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Tất cả
                  <input type="radio" name="radUserGender" value="all" checked="checked" /></label>
                <label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Nam <input type="radio" name="radUserGender" value="Nam" /></label>
                <label style="
                      display: inline;
                      width: fit-content;
                      margin-left: 10px;
                    ">Nữ <input type="radio" name="radUserGender" value="Nữ" /></label>
              </label>
            </label>
            <button class="u-full-width" onclick="suggestions()" id="btnSuggestion" disabled="disabled"
              style="display: none">
              Gợi ý tiền tố
            </button>
            <button class="u-full-width button-primary" onclick="loadUsers()" style="font-family: math">
              Tạo
            </button>
            <section class="tooltip">
              <button class="u-full-width" onclick="CopyUser()" style="display: none" id="btncopyuser">
                <span class="tooltiptext" id="userTooltip"></span>Sao chép
              </button>
            </section>
            <a href="" id="txt_user" style="display: none"><button class="u-full-width">Tải Tệp .txt</button></a><a
              href="" id="csv_user" style="display: none"><button class="u-full-width">Tải Tệp .csv</button></a>
            <section id="textusercopy"></section>
          </div>
          <div class="columns six">
            <div id="result_user"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tabcontent" id="icons">
  <div class="container">
    <div class="content" id="content">
      <h1>Tạo Icons Ngẫu Nhiên</h1>
      <div id="generate-icons">
        <div class="row">
          <div class="columns six">
            <label>Số lượng
              <input id="inputIconQuantity" class="u-full-width" value="9" type="number" /></label>
            <button class="u-full-width button-primary" onclick="loadIcon()" style="font-family: math">
              Tạo
            </button>
            <section class="tooltip">
              <button class="u-full-width" onclick="CopyIcon()" style="display: none" id="btncopyicon">
                <span class="tooltiptext" id="iconTooltip"></span>Sao chép
              </button>
            </section>
            <section id="texticoncopy"></section>
          </div>
          <div class="columns six">
            <div id="result_icon"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="tabcontent" id="rv">
  <div class="container">
    <div class="content" id="content">
      <h1>Tạo RV Ngẫu Nhiên</h1>
      <div id="generate-rvs">
        <div class="row">
          <div class="columns six">
            <label>Số lượng chữ cái
              <input id="inputRvCharQuantity" class="u-full-width" value="10" type="number" /></label>
            <label>Số lượng chữ số
              <input id="inputRvNumQuantity" class="u-full-width" value="13" type="number" /></label>
            <button class="u-full-width button-primary" onclick="loadRv()" style="font-family: math">
              Tạo
            </button>
            <section class="tooltip">
              <button class="u-full-width" onclick="CopyRv()" style="display: none" id="btncopyrv">
                <span class="tooltiptext" id="rvTooltip"></span>Sao chép
              </button>
            </section>
            <section id="textrvcopy"></section>
          </div>
          <div class="columns six">
            <div id="result_rv"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<button onclick="topFunction()" id="GoToTop">⇑</button>
<button onclick="scrollToBottom()" id="GoToBottom">⇓</button>
<script src="js/data.js"></script>
<script src="js/tenchonloc/nam.js"></script>
<script src="js/tenchonloc/nu.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>

</html>
